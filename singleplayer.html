<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenericRTSGame – Singleplayer</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      position: relative;
      font-family: sans-serif;
    }
    #map-wrapper {
      position: relative;
      width: 100vw; height: 100vh;
      aspect-ratio: 768 / 512;
      margin: auto; overflow: hidden;
    }
    #map-bg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #sp-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; /* let wheel events bubble up */
    }
    #sp-container canvas {
      pointer-events: all; /* enable clicking/zooming on canvas */
    }
    /* HUD */
    #hud {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 30;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 16px;
    }
    /* Back button */
    #back-btn {
      position: absolute; top: 16px; left: 16px;
      z-index: 30;
      padding: 8px 16px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <button id="back-btn">← Back to Menu</button>
  <div id="map-wrapper">
    <img id="map-bg" src="assets/maps/default-map.png" alt="Singleplayer Map">
    <div id="sp-container"></div>
    <div id="hud">Resources: 0</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="singleplayer.js"></script>
  <script>
    document.getElementById('back-btn')
      .addEventListener('click', () => window.location.href = 'index.html');
  </script>
</body>
</html>
