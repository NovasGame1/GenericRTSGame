<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenericRTSGame – Singleplayer Map</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      color: #fff;
      font-family: sans-serif;
    }
    img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid #555;
    }
    #back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 16px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #back-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <button id="back-btn">← Back to Menu</button>
  <img src="assets/maps/default-map.png" alt="Singleplayer Map">
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      // go back to the main menu
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
