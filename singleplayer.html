<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenericRTSGame – Singleplayer</title>
  <style>
    body {
      margin: 0;
      background: #222;
      overflow: hidden;
      position: relative;
      font-family: sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    #back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      padding: 8px 16px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #back-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <button id="back-btn">← Back to Menu</button>
  <div id="game-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="singleplayer.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
