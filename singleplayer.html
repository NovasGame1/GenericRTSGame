<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenericRTSGame – Singleplayer</title>
  <style>
    body {
      margin: 0;
      background: #222;
      position: relative;
      overflow: hidden;
    }
    /* Phaser will inject the canvas here */
    #sp-container {
      width: 768px;   /* 12 cols * 64px */
      height: 512px;  /* 8 rows  * 64px */
      margin: 0 auto;
      display: block;
    }
    /* Back button */
    #back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 16px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: sans-serif;
      z-index: 10;
    }
    #back-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>

  <button id="back-btn">← Back to Menu</button>
  <div id="sp-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="singleplayer.js"></script>
  <script>
    // simple back action
    document.getElementById('back-btn')
      .addEventListener('click', () => window.location.href = 'index.html');
  </script>
</body>
</html>
