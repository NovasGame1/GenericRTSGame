<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenericRTSGame</title>
  <style>
    body { margin:0; background:#222; font-family: sans-serif; }
    #menu {
      position: absolute;
      top:50%;
      left:50%;
      transform: translate(-50%,-50%);
      text-align: center;
      z-index: 10;
    }
    #menu button {
      margin: 8px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #444;
      color: #fff;
    }
    #menu button:hover { background: #555; }
    #game-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="singleplayer-btn">Singleplayer</button>
    <button id="multiplayer-btn">Multiplayer</button>
    <button id="settings-btn">Settings</button>
  </div>

  <div id="game-container"></div>

  <!-- attach menu handlers immediately -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('singleplayer-btn').addEventListener('click', () => {
        window.location.href = 'singleplayer.html';
      });
      document.getElementById('multiplayer-btn').addEventListener('click', () => {
        alert('Multiplayer coming soon!');
      });
      document.getElementById('settings-btn').addEventListener('click', () => {
        alert('Settings coming soon!');
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
