<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenericRTSGame</title>
  <style>
    body { margin:0; background:#222; font-family:sans-serif; }
    #menu {
      position: absolute; top:50%; left:50%;
      transform: translate(-50%,-50%);
      text-align: center; z-index: 10;
    }
    #menu button {
      margin: 8px; padding: 12px 24px;
      font-size: 16px; cursor: pointer;
      border:none; border-radius:4px;
      background:#444; color:#fff;
    }
    #menu button:hover { background:#555; }

    /* hidden by default, full-screen map */
    #map-display {
      display: none;
      position: absolute; top:0; left:0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="singleplayer-btn">Singleplayer</button>
    <button id="multiplayer-btn">Multiplayer</button>
    <button id="settings-btn">Settings</button>
  </div>

  <!-- this will show your map image -->
  <img id="map-display" src="" alt="Map">

  <script>
    document.getElementById('singleplayer-btn').addEventListener('click', () => {
      // hide the menu
      document.getElementById('menu').style.display = 'none';
      // point the img at your map file and show it
      const img = document.getElementById('map-display');
      img.src = 'assets/maps/default-map.png'; 
      img.style.display = 'block';
    });

    document.getElementById('multiplayer-btn')
      .addEventListener('click', () => alert('Multiplayer coming soon!'));

    document.getElementById('settings-btn')
      .addEventListener('click', () => alert('Settings coming soon!'));
  </script>
</body>
</html>
